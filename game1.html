<!DOCTYPE html>
<html>
<head>
<title>Oba Games - لعبة</title>
<style>
body {
  background:#222;
  color:white;
  text-align:center;
  font-family:Arial;
}

#box {
  width:50px;
  height:50px;
  background:red;
  position:absolute;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🎮 لعبة اضغط على المربع</h1>
<p>اضغط على المربع لتحصل على نقاط</p>

<h2>النقاط: <span id="score">0</span></h2>

<div id="box"></div>

<script>
let score = 0;
let box = document.getElementById("box");

box.onclick = function(){
  score++;
  document.getElementById("score").innerHTML = score;

  box.style.left = Math.random()*90 + "%";
  box.style.top = Math.random()*80 + "%";
};
</script>

</body>
</html>
