<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>سباق السيارات</title>

<style>
body{
    margin:0;
    background:#111;
    font-family:Arial;
}

canvas{
    display:block;
    margin:auto;
}
</style>

</head>

<body>

<canvas id="game" width="400" height="600"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let screen="menu";

let coins=0;


let player={
    x:175,
    y:480,
    speed:7
};


let enemies=[];

let road=0;

let left=false;
let right=false;





document.addEventListener("keydown",e=>{

if(e.key=="ArrowLeft")
left=true;

if(e.key=="ArrowRight")
right=true;

});



document.addEventListener("keyup",e=>{

if(e.key=="ArrowLeft")
left=false;

if(e.key=="ArrowRight")
right=false;

});







function drawCar(x,y,color){


ctx.fillStyle=color;

ctx.fillRect(
x,
y,
50,
90
);



ctx.fillStyle="#9be7ff";

ctx.fillRect(
x+10,
y+15,
30,
25
);



ctx.fillStyle="black";

ctx.fillRect(x-5,y+15,8,20);
ctx.fillRect(x+47,y+15,8,20);
ctx.fillRect(x-5,y+60,8,20);
ctx.fillRect(x+47,y+60,8,20);


}







function menu(){


ctx.fillStyle="#1565c0";

ctx.fillRect(
0,
0,
400,
600
);



ctx.fillStyle="yellow";

ctx.font="38px Arial";

ctx.fillText(
"سباق السيارات",
45,
120
);



ctx.fillStyle="white";

ctx.font="25px Arial";

ctx.fillText(
"النقاط: "+coins,
130,
180
);



button(
100,
280,
200,
60,
"ابدأ"
);

    
button(
100,
370,
200,
60,
"المتجر"
);


button(
100,
450,
200,
60,
"سياراتي"
);

}







function button(x,y,w,h,text){


ctx.fillStyle="green";

ctx.fillRect(
x,
y,
w,
h
);



ctx.fillStyle="white";

ctx.font="25px Arial";

ctx.fillText(
text,
x+55,
y+40
);


}








function createEnemy(){


enemies.push({

x:Math.random()*350,
y:-100

});


}



setInterval(()=>{

if(screen=="game")
createEnemy();

},1000);







function update(){



if(left && player.x>0)
player.x-=player.speed;


if(right && player.x<350)
player.x+=player.speed;




road+=5;


if(road>100)
road=0;



enemies.forEach(e=>{


e.y+=6;

if(e.y>600 && !e.scored){

coins++;

e.scored=true;

}

if(
player.x < e.x+50 &&
player.x+50 > e.x &&
player.y < e.y+90 &&
player.y+90 > e.y
){

screen="lose";

}



});



enemies=enemies.filter(e=>e.y<650);



}







function game(){


ctx.fillStyle="#555";

ctx.fillRect(
0,
0,
400,
600
);




ctx.fillStyle="white";


for(let y=-100;y<600;y+=100){

ctx.fillRect(
190,
y+road,
20,
50
);

}



drawCar(
player.x,
player.y,
"blue"
);



enemies.forEach(e=>{

drawCar(
e.x,
e.y,
"red"
);

});



ctx.fillStyle="white";

ctx.font="22px Arial";

ctx.fillText(
"النقاط: "+coins,
10,
30
);


mobileButtons();


}





function shop(){


ctx.fillStyle="#222";

ctx.fillRect(
0,
0,
400,
600
);



ctx.fillStyle="yellow";

ctx.font="35px Arial";

ctx.fillText(
"المتجر",
140,
70
);



ctx.fillStyle="white";

ctx.font="22px Arial";

ctx.fillText(
"النقاط: "+coins,
120,
120
);



// السيارات

button(
50,
180,
130,
60,
"أخضر 1000"
);


button(
220,
180,
130,
60,
"بنفسجي 1000"
);



button(
100,
300,
200,
60,
"رجوع"
);



}


    
function lose(){


ctx.fillStyle="black";

ctx.fillRect(
0,
0,
400,
600
);



ctx.fillStyle="yellow";

ctx.font="35px Arial";

ctx.fillText(
"انتهت اللعبة",
90,
230
);



button(
100,
320,
200,
60,
"إعادة"
);

button(
100,
410,
200,
60,
"الرئيسية"
);

}







canvas.addEventListener("click",e=>{


let r=canvas.getBoundingClientRect();

let x=e.clientX-r.left;
let y=e.clientY-r.top;



if(screen=="menu"){


if(y>280 && y<340){

screen="game";

}


if(y>370 && y<430){

screen="shop";

}


if(y>450 && y<510){

screen="cars";

}


}



else if(screen=="lose"){


if(y>320 && y<380){


screen="game";

player.x=175;

enemies=[];


}

if(y>410 && y<470){

screen="menu";

}

}

else if(screen=="shop"){


if(y>300 && y<360){

screen="menu";

}


}

});



function mobileButtons(){

ctx.fillStyle="rgba(0,0,0,0.5)";

ctx.fillRect(20,520,100,60);
ctx.fillRect(280,520,100,60);


ctx.fillStyle="white";

ctx.font="30px Arial";

ctx.fillText("⬅",55,560);
ctx.fillText("➡",315,560);

}





function loop(){


ctx.clearRect(
0,
0,
400,
600
);



if(screen=="menu")
menu();


if(screen=="game"){

update();

game();

}



if(screen=="lose")
lose();

    
if(screen=="shop")
shop();


requestAnimationFrame(loop);


}



loop();



</script>

</body>
</html>
