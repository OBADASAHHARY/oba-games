<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سباق السيارات</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:#111;
overflow:hidden;

}

canvas{

display:block;
margin:auto;
background:#555;

}

</style>

</head>

<body>

<canvas id="game" width="400" height="700"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


//==========================
// البيانات
//==========================

let screen="menu";

let coins=
Number(localStorage.getItem("coins"))||0;

let best=
Number(localStorage.getItem("best"))||0;

let ownedCars=
JSON.parse(localStorage.getItem("ownedCars"))||
["blue"];

let selectedCar=
localStorage.getItem("selectedCar")||
"blue";


//==========================
// اللاعب
//==========================

let player={

x:175,
y:560,
w:50,
h:90,
speed:7

};


//==========================
// الأعداء
//==========================

let enemies=[];

let roadOffset=0;


//==========================
// التحكم
//==========================

let left=false;
let right=false;
//==========================
// التحكم بالكيبورد
//==========================

document.addEventListener("keydown",(e)=>{

if(e.key=="ArrowLeft" || e.key=="a")
left=true;

if(e.key=="ArrowRight" || e.key=="d")
right=true;

});



document.addEventListener("keyup",(e)=>{

if(e.key=="ArrowLeft" || e.key=="a")
left=false;

if(e.key=="ArrowRight" || e.key=="d")
right=false;

});



//==========================
// التحكم بالهاتف
//==========================

canvas.addEventListener("touchstart",(e)=>{

const rect=canvas.getBoundingClientRect();

let x=e.touches[0].clientX-rect.left;

left=false;
right=false;

if(x<200){

left=true;

}else{

right=true;

}

});


canvas.addEventListener("touchend",()=>{

left=false;
right=false;

});



//==========================
// رسم السيارة
//==========================

function drawCar(x,y,color){

ctx.fillStyle=color;

ctx.fillRect(x,y,50,90);


ctx.fillStyle="#9be7ff";

ctx.fillRect(x+10,y+12,30,25);


ctx.fillStyle="black";

ctx.fillRect(x-5,y+15,8,20);
ctx.fillRect(x+47,y+15,8,20);
ctx.fillRect(x-5,y+60,8,20);
ctx.fillRect(x+47,y+60,8,20);

}



//==========================
// إنشاء سيارة عدو
//==========================

function createEnemy(){

enemies.push({

x:Math.random()*340+5,
y:-120,
speed:5,
counted:false

});

}


setInterval(()=>{

if(screen=="game"){

createEnemy();

}

},900);

//==========================
// رسم زر
//==========================

function button(x,y,w,h,text,color="#16a34a"){

ctx.fillStyle=color;
ctx.fillRect(x,y,w,h);

ctx.fillStyle="white";
ctx.font="24px Arial";
ctx.textAlign="center";
ctx.fillText(text,x+w/2,y+38);
ctx.textAlign="start";

}



//==========================
// الصفحة الرئيسية
//==========================

function menu(){


// الخلفية

let g=ctx.createLinearGradient(0,0,0,700);

g.addColorStop(0,"#1976d2");
g.addColorStop(1,"#111");

ctx.fillStyle=g;
ctx.fillRect(0,0,400,700);


// اسم اللعبة

ctx.fillStyle="yellow";
ctx.font="40px Arial";

ctx.fillText(
"🚗 سباق السيارات",
55,
100
);


// النقاط

ctx.fillStyle="white";
ctx.font="24px Arial";

ctx.fillText(
"النقاط: "+coins,
125,
160
);

ctx.fillText(
"أفضل نتيجة: "+best,
105,
200
);


// الأزرار

button(
100,
280,
200,
60,
"ابدأ"
);

button(
100,
370,
200,
60,
"المتجر"
);

button(
100,
460,
200,
60,
"سياراتي"
);

}



//==========================
// رسم الطريق
//==========================

function drawRoad(){

ctx.fillStyle="#555";
ctx.fillRect(0,0,400,700);


// الخطوط البيضاء

ctx.fillStyle="white";

for(let y=-100;y<700;y+=100){

ctx.fillRect(
190,
y+roadOffset,
20,
60
);

}


roadOffset+=6;

if(roadOffset>=100){

roadOffset=0;

}

}

//==========================
// تحديث اللعبة
//==========================

function update(){


// حركة اللاعب

if(left && player.x>0){

player.x-=player.speed;

}


if(right && player.x<350){

player.x+=player.speed;

}



// حركة الأعداء

enemies.forEach(enemy=>{

enemy.y+=enemy.speed;


// احتساب النقاط

if(enemy.y>700 && !enemy.counted){

enemy.counted=true;

coins++;

if(coins>best){

best=coins;

localStorage.setItem("best",best);

}

localStorage.setItem("coins",coins);

}


// الاصطدام

if(

player.x<enemy.x+50 &&
player.x+50>enemy.x &&
player.y<enemy.y+90 &&
player.y+90>enemy.y

){

screen="lose";

}

});


// حذف السيارات الخارجة

enemies=enemies.filter(enemy=>enemy.y<760);

}



//==========================
// رسم اللعبة
//==========================

function game(){


drawRoad();


// اللاعب

drawCar(

player.x,
player.y,
selectedCar

);


// الأعداء

enemies.forEach(enemy=>{

drawCar(

enemy.x,
enemy.y,
"red"

);

});


// النقاط

ctx.fillStyle="white";

ctx.font="22px Arial";

ctx.fillText(

"النقاط: "+coins,
10,
30

);


// أزرار الهاتف

button(20,620,100,55,"⬅","#444");
button(280,620,100,55,"➡","#444");

}



//==========================
// شاشة الخسارة
//==========================

function lose(){


ctx.fillStyle="rgba(0,0,0,0.8)";
ctx.fillRect(0,0,400,700);


ctx.fillStyle="yellow";
ctx.font="40px Arial";

ctx.fillText("انتهت اللعبة",80,220);


button(
100,
330,
200,
60,
"إعادة"
);

button(
100,
420,
200,
60,
"الرئيسية"
);


//==========================
// الضغط على الأزرار
//==========================

canvas.addEventListener("click",(e)=>{

const rect=canvas.getBoundingClientRect();

let x=e.clientX-rect.left;
let y=e.clientY-rect.top;


// القائمة الرئيسية

if(screen=="menu"){

if(x>100 && x<300 && y>280 && y<340){

screen="game";
coins=0;
enemies=[];
player.x=175;

}

else if(x>100 && x<300 && y>370 && y<430){

screen="shop";

}

else if(x>100 && x<300 && y>460 && y<520){

screen="cars";

}

}


// شاشة الخسارة

else if(screen=="lose"){

if(x>100 && x<300 && y>330 && y<390){

screen="game";
coins=0;
enemies=[];
player.x=175;

}

else if(x>100 && x<300 && y>420 && y<480){

screen="menu";

}

}

});


//==========================
// الحلقة الرئيسية
//==========================

function loop(){

ctx.clearRect(0,0,400,700);

switch(screen){

case "menu":
menu();
break;

case "game":
update();
game();
break;

case "lose":
lose();
break;

case "shop":

ctx.fillStyle="#222";
ctx.fillRect(0,0,400,700);

ctx.fillStyle="white";
ctx.font="35px Arial";
ctx.fillText("المتجر",130,80);

button(100,600,200,60,"رجوع");

break;

case "cars":

ctx.fillStyle="#222";
ctx.fillRect(0,0,400,700);

ctx.fillStyle="white";
ctx.font="35px Arial";
ctx.fillText("سياراتي",130,80);

button(100,600,200,60,"رجوع");

break;

}

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
